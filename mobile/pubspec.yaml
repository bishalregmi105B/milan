name: milan
description: Milan - Nepal-first AI-native dating and connection app.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4

  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  dio: ^5.9.0
  socket_io_client: ^3.1.2

  camera: ^0.11.2
  video_player: ^2.10.0
  video_compress: ^3.1.4
  image_picker: ^1.2.1
  record: ^6.1.2
  just_audio: ^0.10.5

  flutter_secure_storage: ^10.0.1
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.4

  firebase_messaging: ^16.0.3
  onesignal_flutter: ^5.3.0

  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1

  webview_flutter: ^4.13.0

  flutter_colorpicker: ^1.1.0
  image_cropper: ^11.0.0
  flutter_image_compress: ^2.4.0

  share_plus: ^12.0.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1
  shimmer: ^3.0.0
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  freezed: ^3.2.3
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf

  assets:
    - assets/theme_presets/
